name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install pnpm
        run: |
          npm install -g pnpm@10
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production dependency audit (report-only)
        continue-on-error: true
        run: |
          mkdir -p artifacts
          pnpm audit --prod --json > artifacts/pnpm-audit-prod.json || true
          echo "Generated artifacts/pnpm-audit-prod.json"

      - name: Upload dependency audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-audit-prod
          path: artifacts/pnpm-audit-prod.json
          if-no-files-found: error

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**/*.{ts,tsx,js,jsx}', 'components/**/*.{ts,tsx,js,jsx}', 'lib/**/*.{ts,tsx,js,jsx}', 'next.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Repo hygiene check
        run: pnpm run repo:check

      - name: Secret scan
        run: pnpm run repo:secrets

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm exec vitest run

      - name: Build
        run: pnpm run build
